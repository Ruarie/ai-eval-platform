name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/README.md'
      - '.gitignore'
      - 'Web-Prototype/**'
  workflow_dispatch:

# 部署只需读取仓库与历史工作流；SSH 凭据仍由仓库 Secrets 注入。
permissions:
  contents: read
  actions: read
  packages: write

# 同一台生产服务器串行部署；不取消正在拉取或切换容器的任务，确保成功基准完整。
concurrency:
  group: ai-eval-production-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: Plan changed services
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      matrix: ${{ steps.services.outputs.matrix }}
      has_services: ${{ steps.services.outputs.has_services }}
      needs_deploy: ${{ steps.services.outputs.needs_deploy }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last successful deploy
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              status: 'success',
              branch: 'main',
              per_page: 1,
            })
            const sha = runs.data.workflow_runs[0]?.head_sha || ''
            core.info(sha ? `上次成功部署提交：${sha}` : '未找到成功部署记录，本次构建全部业务服务')
            core.setOutput('sha', sha)

      - name: Calculate build matrix
        id: services
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TARGET_SHA: ${{ github.sha }}
        run: python3 deploy/plan_services.py --format github

  build:
    name: Build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set real build time
        # 用真实构建时刻而非 head commit 时间戳（后者比实际构建早数分钟，
        # 且 workflow_dispatch 触发时为空），前端版本面板显示为"构建时间"
        run: echo "BUILD_TIME_REAL=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME_REAL }}

  deploy:
    needs: [plan, build]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.needs_deploy == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "部署所需的 Secrets（SSH_HOST / SSH_PRIVATE_KEY）未配置，终止部署以保留成功基准。"
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        if: steps.check.outputs.skip != 'true'
        # 直接使用 runner 自带的 ssh：appleboy/ssh-action 每次运行都要从
        # GitHub Releases 下载 drone-ssh，网络抖动时 504 直接失败（run 42572630521）。
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_BASE_COMMIT: ${{ needs.plan.outputs.base_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # 内网 IP 可能扫不到指纹：扫到就固定下来，扫不到则 accept-new 放行。
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$SSH_USER@$SSH_HOST" \
            "env DEPLOY_COMMIT='$DEPLOY_COMMIT' DEPLOY_BASE_COMMIT='$DEPLOY_BASE_COMMIT' GHCR_TOKEN='$GHCR_TOKEN' GHCR_ACTOR='$GHCR_ACTOR' IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -e
          APP_DIR=/opt/ai-eval-platform
          # 只 fetch，不在锁外 reset 工作区；从目标提交提取脚本后由脚本持锁完成同步。
          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
            # 被取消的旧部署可能留下 HEAD.lock；超过 20s 视为过期后再 fetch。
            find "$APP_DIR/.git" -name '*.lock' -type f ! -newermt "-20 seconds" -delete 2>/dev/null || true
            git fetch origin main
            git cat-file -e "${DEPLOY_COMMIT}^{commit}"
            DEPLOY_ENTRY=$(mktemp)
            git show "${DEPLOY_COMMIT}:deploy/deploy.sh" > "$DEPLOY_ENTRY"
            chmod +x "$DEPLOY_ENTRY"
            exec env DEPLOY_COMMIT="$DEPLOY_COMMIT" DEPLOY_BASE_COMMIT="$DEPLOY_BASE_COMMIT" \
              GHCR_TOKEN="$GHCR_TOKEN" GHCR_ACTOR="$GHCR_ACTOR" \
              IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
              bash "$DEPLOY_ENTRY"
          fi
          echo "错误：部署目录不存在或尚未初始化：$APP_DIR"
          exit 1
          REMOTE
