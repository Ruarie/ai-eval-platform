# 统一安全响应头（由 nginx.conf 的 server 块与各自带 add_header 的 location 共同 include）。
# 注意：nginx 的 add_header 不会从外层继承到「自己也写了 add_header」的 location，
# 所以凡是 location 内有 add_header 的，都必须再 include 本文件，否则安全头会丢失。
# always：错误响应（4xx/5xx）同样带上。

# 禁止浏览器猜测 MIME，防止把上传的文本当脚本执行。
add_header X-Content-Type-Options "nosniff" always;
# 只允许同源页面嵌入（附件 PDF 预览为同源 iframe），防点击劫持；与 CSP frame-ancestors 双保险。
add_header X-Frame-Options "SAMEORIGIN" always;
# 跨站跳转只带源站，不泄露带会话/任务 ID 的完整路径。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 平台不使用定位、支付、USB 等能力。
add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
# 最小 CSP：只收紧嵌入来源与 <base>，不限制脚本/样式来源（Naive UI 与 mermaid
# 依赖内联样式，全面 CSP 需先观察再收紧）；不加 object-src，避免影响内置 PDF 预览。
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'" always;
